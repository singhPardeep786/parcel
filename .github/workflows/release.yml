name: Release update

on:
  push:
    branches: [main]

concurrency:
  group: parcel-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    if: ${{ github.actor != 'github-actions[bot]' }}
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the next free version
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          node <<'NODE'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const pkg = require('./package.json');

          function parts(version) {
            return String(version).split('.').map((n) => Number(n) || 0);
          }
          function bump(version) {
            const next = parts(version);
            next[2] += 1;
            return next.join('.');
          }
          function exists(version) {
            // Tags are the bump signal. Publish already deletes+recreates the GitHub Release.
            try {
              execSync(`git rev-parse -q --verify refs/tags/v${version}`, { stdio: 'ignore' });
              return true;
            } catch {}
            try {
              execSync(`git ls-remote --exit-code --tags origin refs/tags/v${version}`, { stdio: 'ignore' });
              return true;
            } catch {}
            return false;
          }

          let version = pkg.version;
          while (exists(version)) {
            version = bump(version);
          }

          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`next version ${version}`);
          NODE

  build:
    name: Build ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set release version
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Allow an unsigned Windows build when no certificate is stored
        if: matrix.script == 'dist:win'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            node -e "const fs=require('fs'); const p=require('./package.json'); p.build.win.forceCodeSigning=false; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
          fi
      - name: Build installers
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run ${{ matrix.script }}
      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          find dist -maxdepth 1 -type f \( -name 'latest*.yml' -o -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.blockmap' \) -exec cp {} release/ \;
          find release -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: parcel-${{ matrix.os }}
          path: release/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish update
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set release version
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - uses: actions/download-artifact@v4
        with:
          pattern: parcel-*
          path: dist
          merge-multiple: true
      - name: Write the public feed
        run: node scripts/stage-update.js
      - name: Upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release delete "v${version}" --yes --cleanup-tag
          fi
          gh release create "v${version}" dist/updates/* \
            --title "Parcel ${version}" \
            --notes "Parcel ${version}" \
            --target "${{ github.sha }}"
      - name: Publish the feed
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/latest-mac.yml public/latest.yml public/latest-linux.yml public/latest-linux-arm64.yml
          git commit -m "Release Parcel ${version} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
