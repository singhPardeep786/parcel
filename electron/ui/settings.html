<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="UTF-8" />
    <title>Parcel</title>
    <link rel="stylesheet" href="settings.css" />
    <script src="../../src/lib/copy.js"></script>
  </head>
  <body>
    <aside>
      <div class="brand">
        <strong>Parcel</strong>
        <span>Meetings aur tasks</span>
      </div>
      <nav>
        <span class="follow follow-selected" aria-hidden="true"></span>
        <span class="follow follow-hover" aria-hidden="true"></span>
        <button type="button" data-tab="upcoming" class="active">Aane wale</button>
        <button type="button" data-tab="tasks">Tasks</button>
        <button type="button" data-tab="calendar">Calendar</button>
        <button type="button" data-tab="guide">Kaise jodo</button>
      </nav>
      <div class="lang" id="lang-switch">
        <span class="follow follow-selected" aria-hidden="true"></span>
        <span class="follow follow-hover" aria-hidden="true"></span>
        <button type="button" data-lang="hi" class="on">हिंदी</button>
        <button type="button" data-lang="en">English</button>
      </div>
      <button type="button" id="preview" class="preview">Animation dekho</button>
    </aside>
    <div class="update-dock" id="update-dock">
      <span class="update-ping" aria-hidden="true"></span>
      <div class="update-grow">
        <div class="update-pop">
          <button type="button" id="update" class="update-action">
            <span class="update-label" id="update-label">Update dekho</span>
          </button>
          <div class="dl" id="update-dl" hidden>
            <div class="dl-meta">
              <button type="button" class="dl-toggle" id="update-dl-toggle" aria-label="Pause">
                <svg class="dl-icon-pause" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M5 3.5h2.2v9H5zm3.8 0H11v9H8.8z" fill="currentColor" />
                </svg>
                <svg class="dl-icon-play" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M5.2 3.1v9.8L13 8z" fill="currentColor" />
                </svg>
              </button>
              <span class="dl-size" id="update-dl-size"></span>
              <span class="dl-speed" id="update-dl-speed"></span>
            </div>
            <div class="dl-track">
              <span class="dl-fill" id="update-dl-fill"></span>
            </div>
          </div>
          <button type="button" id="update-close" class="update-close" aria-label="Band karo">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
      <button type="button" id="update-icon" class="update-icon" aria-label="Updates">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.5 12a7.5 7.5 0 1 1-2.1-5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M19.6 4.4V9h-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <span class="update-meta">
        <span class="update-version" id="update-version">v1.0.3</span>
        <span class="update-tip" id="update-tip">Updates</span>
      </span>
    </div>
    <main>
      <section id="upcoming" class="panel is-on"></section>
      <section id="tasks" class="panel"></section>
      <section id="calendar" class="panel"></section>
      <section id="guide" class="panel"></section>
    </main>
    <div class="vbar" id="vbar" aria-hidden="true"><div class="vbar-thumb" id="vbar-thumb"></div></div>
    <script src="settings.js"></script>
  </body>
</html>
