<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' file: data:; connect-src 'self' file: blob:;"
    />
    <title>Parcel</title>
    <link rel="stylesheet" href="overlay.css" />
    <script src="../../src/lib/copy.js"></script>
  </head>
  <body>
    <div id="stage" aria-hidden="true">
      <div id="shadow"></div>
      <div id="figure">
        <img id="frame" alt="" draggable="false" />
      </div>
      <div id="crate" data-state="intact" aria-hidden="true">
        <div class="crate-face crate-whole"></div>
        <div class="crate-face crate-half-l"></div>
        <div class="crate-face crate-half-r"></div>
        <span class="crate-shard" style="--dx:0.9;--dy:-1.1;--rot:220deg"></span>
        <span class="crate-shard" style="--dx:1.4;--dy:-0.8;--rot:-160deg"></span>
        <span class="crate-shard" style="--dx:1.9;--dy:-1.3;--rot:300deg"></span>
        <span class="crate-shard" style="--dx:0.5;--dy:-0.7;--rot:-90deg"></span>
        <span class="crate-shard" style="--dx:2.3;--dy:-0.6;--rot:140deg"></span>
        <span class="crate-shard" style="--dx:1.1;--dy:-1.6;--rot:-240deg"></span>
      </div>
    </div>
    <article id="card" aria-hidden="true">
      <p class="kicker" id="kicker">Meeting</p>
      <h2 id="title"></h2>
      <p id="when"></p>
      <div class="remain">
        <strong id="remain">—</strong>
        <span id="remain-label">shuru hone mein</span>
      </div>
      <div class="actions">
        <button type="button" id="snooze">5 min baad</button>
        <button type="button" id="dismiss">Theek hai</button>
      </div>
      <p class="credit">Kratos frames · serial sprite sequence</p>
    </article>
    <p id="error" hidden></p>
    <script>
      window.addEventListener("error", (event) => {
        const el = document.getElementById("error");
        el.hidden = false;
        el.textContent = String(event.message || "overlay error");
      });
    </script>
    <script src="overlay.js"></script>
  </body>
</html>
